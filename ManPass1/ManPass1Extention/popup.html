<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --mp-text: #102a35;
            --mp-muted: #637887;
            --mp-line: rgba(16, 42, 53, 0.12);
            --mp-aqua: #02b8a9;
            --mp-aqua-dark: #028a82;
            --mp-blue: #246bfe;
            --mp-bg: #effdfa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 340px;
            margin: 0;
            padding: 16px;
            color: var(--mp-text);
            background:
                radial-gradient(circle at 12% 0%, rgba(2, 184, 169, 0.22), transparent 32%),
                linear-gradient(180deg, var(--mp-bg), #ffffff);
            font-family: Inter, Arial, sans-serif;
        }

        .popup-shell {
            border: 1px solid var(--mp-line);
            border-radius: 8px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 18px 44px rgba(16, 42, 53, 0.16);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 800;
        }

        .brand-icon {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border-radius: 8px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--mp-aqua), var(--mp-blue));
            font-size: 14px;
        }

        #currentSite {
            margin-bottom: 12px;
            color: var(--mp-muted);
            font-size: 12px;
            font-weight: 700;
        }

        #loginSection {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            border: 1px solid var(--mp-line);
            border-radius: 8px;
            padding: 10px 11px;
            color: var(--mp-text);
            background: #ffffff;
            outline: none;
        }

        input:focus {
            border-color: var(--mp-aqua);
            box-shadow: 0 0 0 3px rgba(2, 184, 169, 0.12);
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            color: #ffffff;
            background: var(--mp-aqua);
            font-weight: 800;
        }

        button:hover {
            background: var(--mp-aqua-dark);
        }

        #status {
            color: var(--mp-muted);
            font-size: 13px;
            line-height: 1.45;
        }

        #loginError {
            color: #c92a3a;
            font-size: 12px;
            font-weight: 700;
        }

        .credential {
            border: 1px solid var(--mp-line);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            background: #ffffff;
        }

        .website {
            font-weight: 850;
        }

        .username {
            color: var(--mp-muted);
            margin: 4px 0 10px;
            font-size: 12px;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="popup-shell">
        <div class="brand">
            <span class="brand-icon">M</span>
            <span>ManPass1</span>
        </div>

        <div id="currentSite"></div>

        <div id="loginSection">
            <input id="email" type="email" placeholder="Email">
            <input id="password" type="password" placeholder="Password">

            <button id="loginButton">
                Login to ManPass1
            </button>

            <div id="loginError"></div>
        </div>

        <div id="status">
            Loading...
        </div>

        <div id="credentials"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
